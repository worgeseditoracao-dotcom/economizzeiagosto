    <style>
      body {

      }
      html, #root { width: 100%; max-width: 100%; min-width: 0; overflow-x: clip; }
      /* Tipografia mais leve e elegante em toda a área interna. */
      .font-black { font-weight: 600 !important; }
      .font-extrabold { font-weight: 600 !important; }
      .font-bold { font-weight: 600 !important; }
      .font-semibold { font-weight: 550 !important; }
      input, select, textarea, button { font-family: inherit; }
      input[type="date"], select { min-width: 0; max-width: 100%; }
      .mobile-bottom-nav {
        min-height: 74px;
        padding-bottom: max(.65rem, env(safe-area-inset-bottom));

      .mobile-content-safe {

      }
      @media (max-width: 640px) {
        body { letter-spacing: 0; }

      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #e2e8f0;
        border-radius: 10px;
      }
      @keyframes premiumReveal {
        from { opacity: 0; transform: translateY(18px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes premiumCardEnter {
        from { opacity: 0; transform: translateY(14px) scale(.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes premiumNumber {
        from { opacity: 0; filter: blur(4px); }
        to { opacity: 1; filter: blur(0); }
      }
      .premium-reveal { animation: premiumReveal .55s cubic-bezier(.2,.8,.2,1) both; }
      .premium-card-enter { animation: premiumCardEnter .5s cubic-bezier(.2,.8,.2,1) both; }
      .premium-number { animation: premiumNumber .7s ease-out .2s both; }
      @media (prefers-reduced-motion: reduce) {
        .premium-reveal, .premium-card-enter, .premium-number { animation: none !important; }
        * { scroll-behavior: auto !important; }
      }
      footer { width: 100%; max-width: 100vw; overflow: hidden; }
      footer > div, footer > div > div, footer p { min-width: 0; max-width: 100%; }
      .sales-floating-offer {
        position: fixed; z-index: 1000; left: 50%;
        bottom: max(12px, env(safe-area-inset-bottom));
        display: flex; width: min(760px, calc(100% - 24px));
        align-items: center; justify-content: space-between; gap: 18px;
        border: 1px solid rgba(255,255,255,.13); border-radius: 20px;
        background: rgba(13,13,34,.96); padding: 11px 12px 11px 18px;
        color: #fff; box-shadow: 0 20px 50px rgba(23,10,47,.28);
        backdrop-filter: blur(18px); opacity: 0; pointer-events: none;
        transform: translate(-50%, calc(100% + 32px));
        transition: transform .28s ease, opacity .28s ease;
      }
      .sales-floating-offer-visible { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
      .sales-floating-offer-copy { display: flex; min-width: 0; align-items: baseline; gap: 9px; white-space: nowrap; }
      .sales-floating-offer-copy span { color: rgba(255,255,255,.62); font-size: 11px; font-weight: 600; }
      .sales-floating-offer-copy strong { font-size: 22px; line-height: 1; }
      .sales-floating-offer-copy small { color: rgba(255,255,255,.5); font-size: 10px; }
      .sales-floating-offer > button { display: inline-flex; flex: 0 0 auto; align-items: center; justify-content: center; gap: 7px; border: 0; border-radius: 13px; background: #9d00ff; padding: 11px 16px; color: #fff; font-size: 12px; font-weight: 700; cursor: pointer; }
      @media (max-width: 640px) {
        footer .md\:flex-row { width: 100%; align-items: center !important; }
        footer .flex.items-center.gap-3 { justify-content: center; max-width: 100%; }
        footer p { overflow-wrap: anywhere; }
        .sales-floating-offer { width: calc(100% - 16px); gap: 8px; border-radius: 16px; padding: 8px; }
        .sales-floating-offer-copy { flex: 1; display: grid; grid-template-columns: auto 1fr; gap: 1px 7px; align-items: center; white-space: normal; }
        .sales-floating-offer-copy span { grid-column: 1 / -1; font-size: 9px; }
        .sales-floating-offer-copy strong { font-size: 18px; }
        .sales-floating-offer-copy small { font-size: 9px; }
        .sales-floating-offer > button { min-height: 44px; padding: 9px 12px; font-size: 11px; }
      }
