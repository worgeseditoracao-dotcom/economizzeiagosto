    <style>
      body {
        font-family: 'DM Sans', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        letter-spacing: -0.006em;
        font-weight: 400;
      }
      /* Tipografia mais leve e elegante em toda a área interna. */
      .font-black { font-weight: 600 !important; }
      .font-extrabold { font-weight: 600 !important; }
      .font-bold { font-weight: 600 !important; }
      .font-semibold { font-weight: 550 !important; }
      input, select, textarea, button { font-family: inherit; }
      input[type="date"], select { min-width: 0; max-width: 100%; }
      .mobile-bottom-nav {
        min-height: 74px;
        padding-bottom: max(.65rem, env(safe-area-inset-bottom));
      }
      .mobile-content-safe {
        padding-bottom: 3.25rem;
      }
      @media (max-width: 640px) {
        body { letter-spacing: 0; }
        .tracking-widest, [class*="tracking-[0.2em]"] { letter-spacing: .08em !important; }
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #e2e8f0;
        border-radius: 10px;
      }
      @keyframes premiumReveal {
        from { opacity: 0; transform: translateY(18px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes premiumCardEnter {
        from { opacity: 0; transform: translateY(14px) scale(.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes premiumNumber {
        from { opacity: 0; filter: blur(4px); }
        to { opacity: 1; filter: blur(0); }
      }
      .premium-reveal { animation: premiumReveal .55s cubic-bezier(.2,.8,.2,1) both; }
      .premium-card-enter { animation: premiumCardEnter .5s cubic-bezier(.2,.8,.2,1) both; }
      .premium-number { animation: premiumNumber .7s ease-out .2s both; }
      @media (prefers-reduced-motion: reduce) {
        .premium-reveal, .premium-card-enter, .premium-number { animation: none !important; }
        * { scroll-behavior: auto !important; }
      }
    </style>
